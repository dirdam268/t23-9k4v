<style>
  :root{
    --tinta:#122238; --tinta2:#2a405a; --suave:#64798f;
    --papel:#f4f7fb; --tarjeta:#ffffff; --borde:#dbe5ef; --borde2:#eef3f8;
    --acento:#FE683F; --acento-suave:#fff0eb;
    --verde:#16a34a; --amarilla:#d9a406; --naranja:#f97316; --rojo:#dc2626; --gris:#94a3b8;
    --alto:#0e7490; --medio:#64748b; --bajo:#a16207;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--papel); color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.45; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1500px;margin:0 auto;padding:0 18px 64px}

  /* ---------- cabecera ---------- */
  header.top{background:var(--tinta);color:#fff;padding:20px 0 22px;margin-bottom:20px}
  header.top .wrap{padding-bottom:0}
  .marca{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:11px;background:var(--acento);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:none}
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px}
  .sub{font-size:12px;color:#a8bcd2;margin-top:2px}

  /* ---------- tarjetas ---------- */
  .card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;margin-bottom:16px}
  .card > h2{
    font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--suave);
    margin:0;padding:13px 16px;border-bottom:1px solid var(--borde2);font-weight:700;
    display:flex;align-items:center;justify-content:space-between;gap:12px
  }
  .card .body{padding:14px 16px}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--borde2)}
  .kpi{background:var(--tarjeta);padding:14px 16px}
  .kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave);font-weight:600}
  .kpi .v{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:3px;font-variant-numeric:tabular-nums}
  .kpi .n{font-size:11px;color:var(--suave);margin-top:1px}

  /* ---------- filtros ---------- */
  .filtro{margin-bottom:11px}
  .filtro:last-child{margin-bottom:0}
  .filtro .et{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave);font-weight:700;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    border:1px solid var(--borde);background:#fff;color:var(--tinta2);
    padding:5px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;user-select:none;line-height:1.3
  }
  .chip:hover{border-color:#b9cbdd}
  .chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
  .chip .cnt{font-size:11px;opacity:.65;font-weight:600;font-variant-numeric:tabular-nums}
  .punto{width:9px;height:9px;border-radius:50%;flex:none}
  .buscador{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .buscador input{
    flex:1;min-width:200px;border:1px solid var(--borde);border-radius:8px;padding:9px 12px;
    font-size:14px;font-family:inherit;color:var(--tinta);outline:none;background:#fff
  }
  .buscador input:focus{border-color:var(--acento)}
  .btn{
    border:1px solid var(--borde);background:#fff;color:var(--tinta2);border-radius:8px;
    padding:9px 14px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit
  }
  .btn:hover{border-color:#b9cbdd}
  .btn.pri{background:var(--acento);border-color:var(--acento);color:#fff}

  /* ---------- tablas ---------- */
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--borde2)}
  th{
    background:#f8fbfe;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--suave);font-weight:700;position:sticky;top:0;z-index:2
  }
  th.txt,td.txt{text-align:left}
  td.num,th.num{font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#f8fbfe}
  tbody tr.clic{cursor:pointer}
  tfoot td{font-weight:800;background:#f8fbfe;border-top:2px solid var(--borde);border-bottom:none}
  th.orden{cursor:pointer;user-select:none}
  th.orden:hover{color:var(--tinta)}
  th.orden.act{color:var(--acento)}
  .neg{color:var(--rojo)}

  .tag{
    display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;
    font-size:11.5px;font-weight:700;background:#f1f5f9;color:var(--tinta2);white-space:nowrap
  }

  /* ---------- detalle ---------- */
  .velo{position:fixed;inset:0;background:rgba(18,34,56,.5);z-index:900;display:flex;justify-content:flex-end}
  .panel{
    background:#fff;width:min(560px,100%);height:100%;overflow-y:auto;
    box-shadow:-8px 0 30px rgba(0,0,0,.18);animation:entra .18s ease-out
  }
  @keyframes entra{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
  .panel .cab{position:sticky;top:0;background:var(--tinta);color:#fff;padding:16px 18px;z-index:2}
  .panel .cab h3{margin:0;font-size:17px;font-weight:800}
  .panel .cab .d{font-size:12px;color:#a8bcd2;margin-top:2px}
  .panel .cerrar{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:17px;line-height:1}
  .panel .cont{padding:16px 18px}
  .pl{width:100%;border-collapse:collapse;font-size:13px}
  .pl td{padding:6px 0;border-bottom:1px solid var(--borde2);text-align:right;font-variant-numeric:tabular-nums}
  .pl td:first-child{text-align:left;color:var(--tinta2)}
  .pl tr.tot td{font-weight:800;border-top:1px solid var(--borde);border-bottom:none;padding-top:9px}
  .pl tr.sec td{padding-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave);font-weight:700;border-bottom:none}

  .nota{font-size:12.5px;color:var(--tinta2);line-height:1.6}
  .nota b{color:var(--tinta)}
  details.expl{border:1px solid var(--borde);border-radius:12px;background:#fff;margin-bottom:16px}
  details.expl > summary{padding:13px 16px;cursor:pointer;font-weight:700;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:8px}
  details.expl > summary::-webkit-details-marker{display:none}
  details.expl > summary::before{content:'▸';color:var(--acento);font-size:13px}
  details.expl[open] > summary::before{content:'▾'}
  details.expl .body{padding:0 16px 16px}

  .vacio{padding:34px 16px;text-align:center;color:var(--suave);font-size:14px}
  .pie{text-align:center;color:var(--suave);font-size:11.5px;margin-top:22px;line-height:1.7}

  @media (max-width:640px){
    .wrap{padding:0 12px 48px}
    .kpi .v{font-size:19px}
    th,td{padding:7px 8px;font-size:12.5px}
  }
</style>
</head>

      try { localStorage.removeItem('d23_k'); } catch (e2) {}
      input.focus();
    }
  })();
})();
